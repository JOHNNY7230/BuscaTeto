<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuscaTeto | Acesse sua Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <main class="login-container">
        <div class="login-sidebar">
            <div class="sidebar-content">
                <div class="brand-logo white">🏠 Busca<span>Teto</span></div>
                <h1>Encontre o seu próximo lar, sem complicações.</h1>
                <p>Milhares de opções exclusivas esperam por você.</p>
            </div>
        </div>

        <div class="login-form-wrapper">
            <div class="login-card-glass">
                <h2>Bem-vindo de volta</h2>
                <p>Acesse sua conta para continuar sua busca.</p>

                <!-- Exemplo de como deve estar no seu HTML -->
                <div id="login-invalid-msg" style="display:none; color:red;">Usuário ou senha incorretos.</div>
                <div id="email-format-error" style="display:none; color:red;">E-mail inválido.</div>

                <form id="login-form">
                    <div class="input-group">
                        <label for="user-email">Seu e-mail</label>
                        <div class="input-with-icon">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><path d="m22 6-10 7L2 6" /></svg>
                            <input type="email" id="user-email" placeholder="exemplo@gmail.com" required="required" />
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label for="user-pass">Sua senha</label>
                            <a href="#" class="forgot-pass">Esqueceu a senha?</a>
                        </div>
                        <div class="input-with-icon">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                            <input type="password" id="user-pass" placeholder="••••••••" required="required" />
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-animated">
                        <span>Acessar Plataforma</span>
                        <svg class="icon-btn" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
                    </button>
                </form>

                <div class="card-footer">
                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
