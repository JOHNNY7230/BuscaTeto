<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaTeto - Cadastre-se</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>Crie sua conta</h1>
            <p>Preencha os dados abaixo para começar sua busca.</p>
        </div>

        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome completo</label>
                <div class="input-field">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" placeholder="Seu nome completo" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Seu e-mail</label>
                <div class="input-field">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="seuemail@gmail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>
                <div class="input-field">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Crie uma senha</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Criar Conta <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p class="footer-text">
            Já tem uma conta? <a href="index.html">Faça login</a>
        </p>
    </div>
</body>
</html>
